<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pallavi ❤️</title>

<style>
body {
    margin: 0;
    padding: 0;
    font-family: 'Segoe UI', sans-serif;
    text-align: center;
    background: linear-gradient(to bottom right, #ff9ecf, #ffc3e6);
    overflow: hidden;
}

.container {
    padding: 60px 20px;
}

h1 {
    font-size: 8vw;
    color: white;
}

p {
    font-size: 5vw;
    color: white;
}

button {
    padding: 15px 30px;
    font-size: 5vw;
    border: none;
    border-radius: 30px;
    cursor: pointer;
    margin: 15px;
}

#yesBtn {
    background-color: #ff4d88;
    color: white;
}

#noBtn {
    background-color: white;
    color: #ff4d88;
    position: absolute;
}

.hearts {
    position: fixed;
    bottom: -10px;
    font-size: 24px;
    animation: float 5s linear infinite;
    color: white;
}

@keyframes float {
    0% {transform: translateY(0);}
    100% {transform: translateY(-100vh);}
}
</style>
</head>

<body>

<div class="container" id="content">
    <h1>4 years ago… you said YES.</h1>
    <p>And I still get butterflies, Pallavi ❤️</p>
    <button onclick="nextPage()">Continue</button>
</div>

<script>

function nextPage() {
    document.getElementById("content").innerHTML = `
        <h1>You still smile the same way…</h1>
        <p>You still make my world softer and brighter.</p>
        <button onclick="finalPage()">So...?</button>
    `;
}

function finalPage() {
    document.getElementById("content").innerHTML = `
        <h1>Pallavi ❤️</h1>
        <p>Will you be my Valentine… again?</p>
        <button id="yesBtn" onclick="yesClicked()">Yes ❤️</button>
        <button id="noBtn" onmouseover="moveButton()">No 🙈</button>
    `;
}

function yesClicked() {
    document.getElementById("content").innerHTML = `
        <h1>Good.</h1>
        <p>Because I will always choose you. ❤️<br><br>
        Happy Valentine’s Day.</p>
    `;
}

function moveButton() {
    let button = document.getElementById("noBtn");
    let x = Math.random() * (window.innerWidth - 150);
    let y = Math.random() * (window.innerHeight - 50);
    button.style.left = x + "px";
    button.style.top = y + "px";
}

setInterval(() => {
    let heart = document.createElement("div");
    heart.className = "hearts";
    heart.innerHTML = "❤️";
    heart.style.left = Math.random() * 100 + "vw";
    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 5000);
}, 500);

</script>

</body>
</html>
